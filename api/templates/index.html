<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload File</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
      }

      .upload-card {
        max-width: 500px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 12px;
        background-color: #ffffff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 20px;
        text-align: center;
        color: #343a40;
      }

      .btn-upload {
        width: 100%;
      }

      .progress {
        height: 8px;
        margin-top: 15px;
        display: none;
      }

      .secure-note {
        font-size: 0.85rem;
      }
    </style>
  </head>

  <body>
    <div class="upload-card">
      <h1>Upload</h1>

      <form id="uploadForm">
        <div class="mb-3">
          <label for="file_input" class="form-label">Select File</label>

          <input class="form-control" type="file" id="file_input" required />
        </div>

        <!-- Secure upload option -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="secure_upload" />

          <label class="form-check-label" for="secure_upload">
            Secure file upload encryption
            <span class="text-muted d-block secure-note">
              Only eligible for ZIP files
            </span>
          </label>
        </div>

        <!-- Encryption string input -->
        <div class="mb-3" id="encryptionBox" style="display: none">
          <label for="encryption_key" class="form-label">
            Encryption String
          </label>

          <input
            class="form-control"
            type="password"
            id="encryption_key"
            placeholder="Enter encryption string"
          />

          <div class="form-text">
            Keep this string safe. The same string is required to decrypt the
            ZIP file later.
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-upload">Upload</button>
      </form>

      <div class="progress">
        <div
          id="progress-bar"
          class="progress-bar progress-bar-striped progress-bar-animated"
          style="width: 0%"
        ></div>
      </div>

      <div id="status" class="mt-3 text-center"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const form = document.getElementById("uploadForm");

      const fileInput = document.getElementById("file_input");

      const progressBar = document.getElementById("progress-bar");

      const progressContainer = document.querySelector(".progress");

      const statusDiv = document.getElementById("status");

      const secureUpload = document.getElementById("secure_upload");

      const encryptionBox = document.getElementById("encryptionBox");

      const encryptionKey = document.getElementById("encryption_key");

      // Show or hide encryption string field
      secureUpload.addEventListener("change", () => {
        if (secureUpload.checked) {
          encryptionBox.style.display = "block";
        } else {
          encryptionBox.style.display = "none";
          encryptionKey.value = "";
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const file = fileInput.files[0];

        if (!file) {
          alert("Please select a file!");
          return;
        }

        const isSecureUpload = secureUpload.checked;

        // Validate ZIP file only for secure encrypted upload
        if (isSecureUpload) {
          if (!file.name.toLowerCase().endsWith(".zip")) {
            alert("Secure encrypted upload is only allowed for ZIP files.");
            return;
          }

          if (!encryptionKey.value.trim()) {
            alert("Please enter an encryption string.");
            return;
          }
        }

        statusDiv.textContent = "";

        progressContainer.style.display = "block";

        progressBar.style.width = "10%";

        progressBar.textContent = "Processing...";

        progressBar.classList.remove("bg-success");

        progressBar.classList.remove("bg-danger");

        try {
          // Convert file to base64
          const base64Data = await new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = () => resolve(reader.result.split(",")[1]);

            reader.onerror = reject;

            reader.readAsDataURL(file);
          });

          const payload = {
            file_name: file.name,

            total_chunks: 1,

            chunks: [base64Data],

            secure_upload: isSecureUpload,

            encryption_key: isSecureUpload ? encryptionKey.value : "",
          };

          progressBar.style.width = "50%";

          progressBar.textContent = isSecureUpload
            ? "Encrypting and uploading..."
            : "Uploading...";

          const res = await fetch("/upload_file", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(payload),
          });

          const data = await res.json();

          if (data.success) {
            progressBar.style.width = "100%";

            progressBar.textContent = "Done!";

            progressBar.classList.add("bg-success");

            const uploadedFileName = data.uploaded_file || file.name;

            statusDiv.innerHTML = `<div class="alert alert-success mt-3">
              ✅ Upload successful!<br/>
              Uploaded file: <strong>${uploadedFileName}</strong>
            </div>`;
          } else {
            throw new Error(data.error || "Unknown error");
          }
        } catch (err) {
          progressBar.classList.add("bg-danger");

          progressBar.style.width = "100%";

          progressBar.textContent = "Failed!";

          statusDiv.innerHTML = `<div class="alert alert-danger mt-3">
            ❌ Error: ${err.message}
          </div>`;
        }
      });
    </script>
  </body>
</html>
